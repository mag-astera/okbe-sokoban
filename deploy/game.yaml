# Independent of the development sync session. Uses the dedicated workspace PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: okbe-sokoban-play
  namespace: obelisk
  labels: {app: okbe-sokoban-play}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: okbe-sokoban-play}
  template:
    metadata:
      labels: {app: okbe-sokoban-play}
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: astera.org/ns-obelisk, operator: In, values: ['true']}
              - {key: nvidia.com/gpu.present, operator: In, values: ['true']}
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: astera.org/namespace, operator: Exists, effect: NoSchedule}
      - {key: astera.org/min-actl-version, operator: Exists, effect: NoSchedule}
      containers:
      - name: game
        image: docker.io/library/python:3.12-slim
        workingDir: /home/dev/workspace
        command: [/home/dev/okbe-venv/bin/python, app.py]
        env:
        - {name: METRICS_DIR, value: /data}
        - {name: HOME, value: /tmp}
        - {name: MPLCONFIGDIR, value: /tmp/matplotlib}
        - {name: NUMBA_CACHE_DIR, value: /tmp/numba}
        - {name: OPENBLAS_NUM_THREADS, value: '1'}
        - {name: PYTHONDONTWRITEBYTECODE, value: '1'}
        ports: [{containerPort: 8080, name: http}]
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: '1', memory: 2Gi}
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: home, mountPath: /home/dev, readOnly: true}
        - {name: home, mountPath: /data, subPath: metrics}
        startupProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 30
      volumes:
      - name: home
        persistentVolumeClaim: {claimName: actl-ws-tomringstrom-okbe-sokoban-home}
---
apiVersion: v1
kind: Service
metadata:
  name: okbe-sokoban-play
  namespace: obelisk
spec:
  selector: {app: okbe-sokoban-play}
  ports: [{name: http, port: 80, targetPort: http}]
